# Lift Easy Garage Doors: nginx inside the container (Caddy in front handles HTTPS)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    # Short link for customers: lifteasygaragedoors.co.uk/review
    location = /review { return 301 https://g.page/r/CVm8Yxkicv2cEBM/review; }

    # Pages work with or without .html (/areas → areas.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
