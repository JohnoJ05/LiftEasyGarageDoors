# Lift Easy Garage Doors: nginx inside the container (Caddy in front handles HTTPS)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Compress text files, including requests passed on by Caddy
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml application/xml text/xml;

    # Short link for customers: lifteasygaragedoors.co.uk/review
    location = /review { return 301 https://g.page/r/CVm8Yxkicv2cEBM/review; }

    # CSS, JS and images change name (?v=) when they change, so browsers can keep them
    location ~* \.(css|js|webp|jpg|jpeg|png|svg|ico|geojson|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Pages work with or without .html (/areas → areas.html); always check for a newer page
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
