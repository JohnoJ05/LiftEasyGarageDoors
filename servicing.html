<p style="margin: 0 0 6px; font-size: 18px; line-height: 1.5; max-width: 470px">Steve can inspect, adjust and service your existing garage door and identify potential problems before they become bigger and more expensive.</p>
</div>

<h3 style="margin: 14px 0 0; font-size: 23px; font-weight: 800; font-stretch: 105%; letter-spacing: -0.3px">Inspection of your existing door</h3>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.55; color: #222222">A thorough look over the door and its moving parts (springs, cables, rollers, hinges, tracks, locks and fixings), checking for wear or damage.</p>
</div>
<div style="padding: 32px 32px 34px; border-right: 2px solid #111111; border-bottom: 2px solid #111111">
<div aria-hidden="true" style="width: 32px; height: 4px; background: #D7141A"></div>
<h3 style="margin: 14px 0 0; font-size: 23px; font-weight: 800; font-stretch: 105%; letter-spacing: -0.3px">Adjustments</h3>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.55; color: #222222">Setting the door up so it opens and closes evenly, sits properly in the frame and isn’t straining its springs or opener.</p>
</div>
<div style="padding: 32px 32px 34px; border-right: 2px solid #111111; border-bottom: 2px solid #111111">
<div aria-hidden="true" style="width: 32px; height: 4px; background: #D7141A"></div>
<h3 style="margin: 14px 0 0; font-size: 23px; font-weight: 800; font-stretch: 105%; letter-spacing: -0.3px">Full servicing</h3>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.55; color: #222222">Cleaning and lubricating the moving parts and tightening fittings, so the door runs quietly and smoothly.</p>
</div>
<div style="padding: 32px 32px 34px; border-right: 2px solid #111111; border-bottom: 2px solid #111111">
<div aria-hidden="true" style="width: 32px; height: 4px; background: #D7141A"></div>
<h3 style="margin: 14px 0 0; font-size: 23px; font-weight: 800; font-stretch: 105%; letter-spacing: -0.3px">Spotting problems early</h3>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.55; color: #222222">Worn parts are pointed out while they’re still a small job, not after they’ve failed and left the door stuck.</p>
</div>
<div style="padding: 32px 32px 34px; border-right: 2px solid #111111; border-bottom: 2px solid #111111">
<div aria-hidden="true" style="width: 32px; height: 4px; background: #D7141A"></div>

<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.55; color: #222222">If your door is electric, the opener can be looked at too. See <a href="remotes.html" style="font-weight: 800; color: #111111; border-bottom: 2px solid #D7141A">remotes &amp; automatic doors</a>.</p>

<div style="padding: 32px 32px 34px; border-right: 2px solid #111111; border-bottom: 2px solid #111111">
<div aria-hidden="true" style="width: 32px; height: 4px; background: #D7141A"></div>

<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.55; color: #222222">Steve will always give it to you straight. If your door can’t be repaired, he’ll point you to a company who can help.</p>

<div class="sv-two" style="max-width: 1180px; margin: 0 auto; padding: 0 40px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px 72px; align-items: start">

<h2 class="sv-h2" style="margin: 24px 0 0; font-size: 46px; font-weight: 800; font-stretch: 108%; line-height: 1; letter-spacing: -1.4px">Small jobs now, <span style="background: linear-gradient(transparent 64%, #FFD401 64%, #FFD401 92%, transparent 92%); -webkit-box-decoration-break: clone; box-decoration-break: clone">fewer breakdowns</span> later</h2>
<p style="margin: 28px 0 0; font-size: 18px; line-height: 1.6">Every time a garage door opens and closes, its moving parts wear a little. A regular service keeps your existing door safe, quiet and reliable, and spots that wear before it turns into a breakdown or a bigger, more expensive repair.</p>
<p style="margin: 18px 0 0; font-size: 18px; line-height: 1.6"><strong style="font-weight: 900">Lift Easy doesn’t sell new doors</strong>, so the aim is always to keep the door you already have working well for as long as possible.</p>
<p style="margin: 18px 0 0; font-size: 18px; line-height: 1.6">If a garage door is maintained and serviced, it should last 20 to 30 years, and sometimes longer. So don’t think that when your door is broken, it always needs replacing. Steve will leave you with a smooth-operating, well-balanced, easy-to-use garage door that will give you many more years of service.</p>
<p style="margin: 18px 0 0; font-size: 18px; line-height: 1.6">Having a repair? A service of the door is included in the price Steve quotes for the repair.</p>

<p style="margin: 14px 0 0; font-size: 15px; line-height: 1.55">Every time a garage door opens and closes, its moving parts wear a little. A regular service keeps your existing door safe, quiet and reliable, and spots that wear before it turns into a breakdown.</p>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.55"><strong style="font-weight: 900">Lift Easy doesn’t sell new doors</strong>, so the aim is always to keep the door you already have working well for as long as possible.</p>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.55">If a garage door is maintained and serviced, it should last 20 to 30 years, and sometimes longer. So don’t think that when your door is broken, it always needs replacing. Steve will leave you with a smooth-operating, well-balanced, easy-to-use garage door that will give you many more years of service.</p>

<script>
var DesktopView = (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { doors: [] };
  }
  renderVals() {
    const dz = this.state.doors;
    const dv = {};
    [0, 1, 2, 3].forEach((i) => {
      const on = dz.indexOf(i) !== -1;
      dv['front' + i] = !on;
      dv['back' + i] = on;
      dv['pressed' + i] = on ? 'true' : 'false';
      dv['flip' + i] = () => this.setState({ doors: on ? dz.filter((x) => x !== i) : dz.concat([i]) });
    });
    return dv;
  }
}
return Component;
})();
var PhoneView = (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, open: 0, picked: [], doors: [] };
  }
  renderVals() {
    const inc = [
      ['Inspection of your existing door', 'A thorough look over the door and its moving parts (springs, cables, rollers, hinges, tracks, locks and fixings), checking for wear or damage.'],
      ['Adjustments', 'Setting the door up so it opens and closes evenly, sits properly in the frame and isn’t straining its springs or opener.'],
      ['Full servicing', 'Cleaning and lubricating the moving parts and tightening fittings, so the door runs quietly and smoothly.'],
      ['Spotting problems early', 'Worn parts are pointed out while they’re still a small job, not after they’ve failed and left the door stuck.'],
      ['Automatic openers', 'If your door is electric, the opener can be looked at too.'],
      ['Honest advice', 'Steve will always give it to you straight. If your door can’t be repaired, he’ll point you to a company who can help.']
    ];
    const included = inc.map((d, i) => {
      const isOpen = this.state.open === i;
      return { num: '0' + (i + 1), title: d[0], text: d[1], open: isOpen, closed: !isOpen, expanded: isOpen ? 'true' : 'false', toggle: () => this.setState({ open: isOpen ? -1 : i }) };
    });
    const labels = ['Grinding, squeaking or banging', 'Jerky or uneven movement', 'Heavier to lift than it used to be', 'Doesn’t close fully or evenly', 'Frayed cables or worn parts', 'Opener struggling or slow'];
    const picked = this.state.picked;
    const signs = labels.map((l, i) => {
      const on = picked.indexOf(i) !== -1;
      return { label: l, on: on, off: !on, toggle: () => this.setState({ picked: on ? picked.filter((p) => p !== i) : picked.concat([i]) }) };
    });
    const n = picked.length;
    const meter = labels.map((l, i) => ({ on: i < n, off: i >= n }));
    const chosen = picked.map((i) => labels[i].toLowerCase()).join(', ');
    let verdict;
    if (n === 0) {
      verdict = { tag: 'NOTHING TICKED YET', text: 'Doors rarely fail without warning. Tap any signs you’ve spotted.', cta: 'WhatsApp Steve a question' };
    } else if (n <= 2) {
      verdict = { tag: n + ' SIGN' + (n > 1 ? 'S' : '') + ' SPOTTED', text: 'Worth getting it looked at. A service now could save a breakdown, and a bigger bill, later.', cta: 'WhatsApp Steve about a service' };
    } else {
      verdict = { tag: n + ' SIGNS SPOTTED', text: 'Your door is telling you something. Give Steve a call before it leaves you stuck.', cta: 'WhatsApp Steve now' };
    }
    verdict.sms = 'https://wa.me/447939500544?text=' + encodeURIComponent(n ? 'Hi Steve, my garage door has: ' + chosen + '. Could you take a look?' : 'Hi Steve, I have a question about servicing my garage door.');
    const dz = this.state.doors;
    const dv = {};
    [0, 1, 2, 3].forEach((i) => {
      const on = dz.indexOf(i) !== -1;
      dv['front' + i] = !on;
      dv['back' + i] = on;
      dv['pressed' + i] = on ? 'true' : 'false';
      dv['flip' + i] = () => this.setState({ doors: on ? dz.filter((x) => x !== i) : dz.concat([i]) });
    });
    return Object.assign(dv, {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      included: included,
      signs: signs,
      meter: meter,
      verdict: verdict
    });
  }
}
return Component;
})();
DC.view('.view-d', DC.DESKTOP, function (host) { LE.desktop = DC.mount(host, document.getElementById('tpl-d'), DesktopView, LE.hooks.desktop); });
DC.view('.view-m', DC.PHONE, function (host) { LE.phone = DC.mount(host, document.getElementById('tpl-m'), PhoneView, LE.hooks.phone); });
</script>
